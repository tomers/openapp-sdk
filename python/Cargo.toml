[package]
name = "openapp-sdk-python-bridge"
version = "0.1.56"
edition = "2024"
authors = ["OpenApp <support@openapp.house>"]
license = "MIT"
description = "PyO3 bridge that exposes openapp-sdk-core to Python (via maturin)."
repository = "https://github.com/tomers/openapp-sdk"
rust-version = "1.95"

[lib]
name = "_bridge"
crate-type = ["cdylib"]

[dependencies]
openapp-sdk-core = { path = "../rust/crates/core" }

once_cell = "1"
pyo3 = { version = "0.28", features = ["extension-module", "anyhow"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "multipart"] }
rustls = { version = "0.23.40", default-features = false, features = ["std", "tls12", "ring"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
