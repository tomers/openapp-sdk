[package]
name = "openapp-sdk-core-c-bridge"
description = "C ABI bridge around openapp-sdk-core so non-PyO3 language SDKs (.NET, Ruby, Go, Swift) can reuse the same Rust core."
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "openapp_sdk_core_c_bridge"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
openapp-sdk-core = { workspace = true }

futures = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true }
