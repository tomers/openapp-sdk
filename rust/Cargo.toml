[workspace]
members = [
    "crates/common",
    "crates/core",
    "crates/core-c-bridge",
]
resolver = "2"

[workspace.package]
version = "0.1.54"
edition = "2024"
authors = ["Tomer <shalev.tomer@gmail.com>"]
repository = "https://github.com/tomers/openapp-sdk"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
openapp-sdk-common = { path = "crates/common", version = "0.1.54" }
openapp-sdk-core = { path = "crates/core", version = "0.1.54" }

anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
futures = "0.3"
http = "1"
libc = "0.2"
once_cell = "1"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider", "stream", "multipart"] }
reqwest-middleware = { version = "0.5", features = ["json", "query", "multipart"] }
reqwest-retry = "0.9"
rustls = { version = "0.23.40", default-features = false, features = ["std", "tls12", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

# dev / test
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
