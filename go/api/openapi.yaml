openapi: 3.1.0
info:
  description: IoT Device Management (Gates/Doors/Provisioning) API
  license:
    name: Proprietary
    url: https://openapp.house/
  title: OpenApp API
  version: v1
servers:
- description: API v1 base path
  url: /api/v1
paths:
  /admin/quota_overrides:
    get:
      operationId: get_admin_quota_overrides
      responses:
        "200":
          description: Quota overrides
      tags:
      - Billing
    post:
      operationId: post_admin_quota_override
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotaOverrideRequest'
        required: true
      responses:
        "200":
          description: Override upserted
      tags:
      - Billing
  /api-keys:
    get:
      operationId: list_api_keys
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApiKeyListItem'
                type: array
          description: List of API keys
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
      security:
      - bearer_auth: []
      tags:
      - API Keys
    post:
      operationId: create_api_key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
          description: API key created
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal server error
      security:
      - bearer_auth: []
      tags:
      - API Keys
  /api-keys/{id}:
    delete:
      operationId: revoke_api_key
      parameters:
      - description: API key ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: API key revoked
        "401":
          description: Unauthorized
        "404":
          description: Not found
        "500":
          description: Internal server error
      security:
      - bearer_auth: []
      tags:
      - API Keys
    patch:
      operationId: update_api_key
      parameters:
      - description: API key ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApiKeyRequest'
        required: true
      responses:
        "204":
          description: API key updated
        "401":
          description: Unauthorized
        "404":
          description: Not found
        "500":
          description: Internal server error
      security:
      - bearer_auth: []
      tags:
      - API Keys
  /api-keys/{id}/purge:
    delete:
      operationId: purge_api_key
      parameters:
      - description: API key ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: API key deleted
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "404":
          description: Not found
        "409":
          description: Conflict (key must be revoked first)
        "500":
          description: Internal server error
      security:
      - bearer_auth: []
      tags:
      - API Keys
  /api-keys/{id}/restore:
    post:
      operationId: restore_api_key
      parameters:
      - description: API key ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: API key restored
        "401":
          description: Unauthorized
        "404":
          description: Not found
        "409":
          description: Conflict (key must be revoked first)
        "500":
          description: Internal server error
      security:
      - bearer_auth: []
      tags:
      - API Keys
  /auth/kratos-identity:
    get:
      operationId: get_auth_kratos_identity
      responses:
        "200":
          description: Session object or null
      summary: |-
        Same as [`get_auth_session`] but under a path that is not stripped by some edge WAF rules
        (which block URL segments named `session` or `whoami`).
      tags:
      - Auth
  /auth/logout:
    post:
      operationId: post_auth_logout
      responses:
        "204":
          description: Logged out
      summary: "Logout: clear session cookie so the browser becomes logged out."
      tags:
      - Auth
  /auth/provisioned:
    get:
      operationId: get_auth_provisioned
      responses:
        "204":
          description: User is provisioned
        "401":
          description: User is not provisioned
      summary: |-
        Lightweight provisioning check. Returns 204 if user is provisioned, 401 if not.
        No DB access; relies on X-User header set by middleware when provisioned.
      tags:
      - Auth
  /auth/session:
    get:
      operationId: get_auth_session
      responses:
        "200":
          description: Session object or null
      summary: "Get current Kratos session if present, otherwise `null`. Public endpoint\
        \ (anonymous allowed)."
      tags:
      - Auth
  /auth/sign-out:
    post:
      operationId: post_auth_sign_out
      responses:
        "204":
          description: Logged out
      tags:
      - Auth
  /auth/whoami:
    get:
      operationId: get_auth_whoami
      responses:
        "200":
          description: Session object or null
      tags:
      - Auth
  /billing/webhooks/{provider}:
    post:
      operationId: post_billing_webhook
      parameters:
      - explode: false
        in: path
        name: provider
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/BillingWebhookPayload'
        description: Raw billing provider webhook payload
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingWebhookResponse'
          description: ""
      tags:
      - Billing
  /devices:
    get:
      operationId: list_devices
      parameters:
      - explode: false
        in: header
        name: X-Org
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: output_options
        required: true
        schema:
          $ref: '#/components/schemas/MultiResourceOutputOptionsQuery'
        style: form
      - explode: true
        in: query
        name: pagination
        required: true
        schema:
          $ref: '#/components/schemas/PaginationQuery'
        style: form
      - description: "Optional filter: only devices belonging to this integration."
        explode: true
        in: query
        name: integration_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: |-
          Optional filter: only devices with metadata.kind equal to this value (e.g. virtual_access_portal).
          Requires integration_id. Filtering done at SQL level.
        explode: true
        in: query
        name: device_kind
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: |-
          Optional filter: only devices with this external_id. Requires integration_id and device_kind.
          Returns at most 1 device. Filtering done at SQL level.
        explode: true
        in: query
        name: external_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: Case-insensitive substring match on localized device name (JSON).
          Best-effort when `integration_id` is set (SQL ILIKE).
        explode: true
        in: query
        name: q
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: "When true, only devices with a non-empty `external_id`. Requires\
          \ `integration_id`."
        explode: true
        in: query
        name: has_external_id
        required: false
        schema:
          nullable: true
          type: boolean
        style: form
      - description: "When true, only devices whose metadata JSON has a non-empty\
          \ `channel` (go2rtc cameras). Requires `integration_id`."
        explode: true
        in: query
        name: has_go2rtc_channel
        required: false
        schema:
          nullable: true
          type: boolean
        style: form
      - description: "When true with `integration_id`, include `stale` per device\
          \ when the provider supports it."
        explode: true
        in: query
        name: include_stale
        required: false
        schema:
          nullable: true
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DeviceResponse'
                type: array
          description: List of devices
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal server error
      security:
      - bearer_auth: []
      summary: List devices for the organization context (X-Org).
      tags:
      - Devices
    post:
      operationId: create_device
      parameters:
      - description: Organization context (required)
        explode: false
        in: header
        name: X-Org
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: include_deleted
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: include_metadata
        required: false
        schema:
          type: boolean
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
          description: Created device
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Unprocessable
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal server error
      security:
      - bearer_auth: []
      summary: Create a device in an organization.
      tags:
      - Devices
  /devices/{device_id}/apartment-floors:
    get:
      operationId: list_device_apartment_floors
      parameters:
      - explode: false
        in: path
        name: device_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Org
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartmentFloorListResponse'
          description: Distinct floors
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal server error
      security:
      - bearer_auth: []
      tags:
      - Entities
  /devices/{device_id}/entities:
    get:
      operationId: list_device_entities
      parameters:
      - explode: false
        in: path
        name: device_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Org
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: include_deleted
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: only_deleted
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: include_metadata
        required: false
        schema:
          type: boolean
        style: form
      - description: "When set, only entities of this type are returned (e.g. `apartment`)."
        explode: true
        in: query
        name: entity_type
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: pagination
        required: true
        schema:
          $ref: '#/components/schemas/PaginationQuery'
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
          description: Paginated entities
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal server error
      security:
      - bearer_auth: []
      summary: List entities for a device.
      tags:
      - Entities
  /devices/{device_id}/entities/metadata-definition:
    get:
      operationId: get_device_entity_metadata_definition
      parameters:
      - explode: false
        in: path
        name: device_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Org
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: entity_type
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMetadataDefinitionResponse'
          description: Entity metadata definition (schema)
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
      security:
      - bearer_auth: []
      summary: "Get provider-specific JSON schema for `entity_metadata`, for creating\
        \ a new entity on a device."
      tags:
      - Entities
  /devices/{id}:
    delete:
      operationId: delete_device
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Org
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: include_deleted
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: include_metadata
        required: false
        schema:
          type: boolean
        style: form
      - description: "If true, delete (or purge) all device entities first."
        explode: true
        in: query
        name: recursive
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
          description: Deleted device
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not found
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Unprocessable (e.g. device has entities)
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal server error
      security:
      - bearer_auth: []
      summary: Soft-delete a device.
      tags:
      - Devices
    get:
      operationId: get_device
      parameters:
      - description: Device ULID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Org
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: output_options
        required: true
        schema:
          $ref: '#/components/schemas/SingleResourceOutputOptionsQuery'
        style: form
      - description: "When true, include `stale` if the integration provider supports\
          \ stale device detection."
        explode: true
        in: query
        name: include_stale
        required: false
        schema:
          nullable: true
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
          description: Device
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal server error
      security:
      - bearer_auth: []
      summary: Get a device by ID.
      tags:
      - Devices
    put:
      operationId: update_device
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Org
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: include_deleted
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: include_metadata
        required: false
        schema:
          type: boolean
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
          description: Updated device
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal server error
      security:
      - bearer_auth: []
      summary: Update a device.
      tags:
      - Devices
  /devices/{id}/door-restrictions:
    get:
      operationId: get_door_restrictions
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoorRestrictionsResponse'
          description: Door restrictions
        "400":
          description: Device is not a virtual access portal
        "404":
          description: Device not found
      summary: |-
        GET /devices/{id}/door-restrictions — list apartment entity IDs allowed to open this door.
        Empty = no restrictions (all building residents can open). Only for virtual_access_portal devices.
      tags:
      - Devices
  /devices/{id}/metadata-definition:
    get:
      operationId: get_device_metadata_definition
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Org
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceMetadataDefinitionResponse'
          description: Device metadata definition (schema + current data)
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
      security:
      - bearer_auth: []
      summary: "Get provider-specific JSON schema for `device_metadata`, for a given\
        \ device."
      tags:
      - Devices
  /devices/{id}/purge:
    delete:
      operationId: hard_delete_device
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Org
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: include_deleted
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: include_metadata
        required: false
        schema:
          type: boolean
        style: form
      - description: "If true, delete (or purge) all device entities first."
        explode: true
        in: query
        name: recursive
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
          description: Purged device
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Not found
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Unprocessable (e.g. device has entities)
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
          description: Internal server error
      security:
      - bearer_auth: []
      summary: Permanently delete (purge) a device.
      tags:
      - Devices
  /devices/{id}/restore:
    post:
      operationId: restore_device
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Org
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: include_deleted
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: include_metadata
        required: false
