          type: array
      required:
      - device_ids
    QuotaKey:
      description: |-
        A metered resource. Lifetime keys count current rows in their source-of-truth
        table; temporal keys accumulate via `usage_events` + `quota_counters`.

        String form (used in DB columns and JSON responses) is snake_case via `EnumString`.
      enum:
      - org_users
      - integrations
      - devices
      - entities
      - zones
      - api_keys
      - door_opens
      - portal_views
      - video_sessions
      - video_session_duration_seconds
      - scripting_executions
      type: string
    QuotaOverrideRequest:
      example:
        quota_key: quota_key
        subject_id: subject_id
        reason: reason
        period: period
        expires_at: expires_at
        subject_type: subject_type
        limit_value: 0
      properties:
        expires_at:
          nullable: true
          type: string
        limit_value:
          format: int64
          type: integer
        period:
          nullable: true
          type: string
        quota_key:
          type: string
        reason:
          nullable: true
          type: string
        subject_id:
          type: string
        subject_type:
          type: string
      required:
      - limit_value
      - quota_key
      - subject_id
      - subject_type
    QuotaPeriod:
      description: |-
        Window kind for a quota. `Lifetime` is "ever / right now"; `Day`/`Week`/`Month`
        reset on calendar boundaries (UTC); `PerSession` resets per opaque session id.
      enum:
      - lifetime
      - day
      - week
      - month
      - per_session
      type: string
