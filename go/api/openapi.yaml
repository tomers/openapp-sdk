        limit:
          $ref: '#/components/schemas/EffectiveLimit'
        period:
          $ref: '#/components/schemas/QuotaPeriod'
        period_end:
          description: Window end (RFC3339). `null` for `Lifetime`.
          nullable: true
          type: string
        period_label:
          description: "Window label (e.g. `lifetime`, `month:2026-04`). Stable across\
            \ reports."
          type: string
        period_start:
          description: Window start (RFC3339). `null` for `Lifetime`.
          nullable: true
          type: string
      required:
      - current
      - key
      - limit
      - period
      - period_label
    Role:
