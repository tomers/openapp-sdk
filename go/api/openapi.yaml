        - period_end: period_end
          period_label: period_label
          current: 0
          period: lifetime
          period_start: period_start
          limit:
            source:
              kind: override
              id: id
            value: 0
          key: org_users
        - period_end: period_end
          period_label: period_label
          current: 0
          period: lifetime
          period_start: period_start
          limit:
            source:
              kind: override
              id: id
            value: 0
          key: org_users
      properties:
        items:
          items:
            $ref: '#/components/schemas/QuotaUsage'
          type: array
        org_id:
          type: string
        tier_slug:
          nullable: true
          type: string
      required:
      - items
      - org_id
    QuotaUsage:
      description: "Single (key, period) entry in a usage report."
      example:
        period_end: period_end
        period_label: period_label
        current: 0
        period: lifetime
        period_start: period_start
        limit:
          source:
            kind: override
            id: id
          value: 0
        key: org_users
      properties:
        current:
          format: int64
          minimum: 0
          type: integer
        key:
