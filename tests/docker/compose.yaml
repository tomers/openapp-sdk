# Local SDK builds for tomers/openapp-sdk.
# Repo root is mounted at /workspace (rust/, python/, go/, tests/ at top level).
# working_dir stays /workspace. Dockerd creates a missing working_dir as root on
# the bind mount before the container user applies; language commands cd themselves.
#
# RUST_VERSION / RUST_DEBIAN: from rust-pin.env (kept in sync with OpenApp config.toml
# `[rust]` by `just maintenance rust-pin-sync`). Pass `--env-file tests/docker/rust-pin.env`.

name: openapp-sdk

services:
  sdk-core:
    build:
      context: .
      dockerfile: rust/Dockerfile
      args:
        RUST_VERSION: ${RUST_VERSION:?set RUST_VERSION from rust-pin.env}
        RUST_DEBIAN: ${RUST_DEBIAN:?set RUST_DEBIAN from rust-pin.env}
    volumes:
      - ../..:/workspace
      - openapp-sdk-cargo-registry:/usr/local/cargo/registry
      - openapp-sdk-cargo-git:/usr/local/cargo/git
      - openapp-sdk-rustup:/usr/local/rustup
    working_dir: /workspace
    user: "${SDK_DOCKER_UID:-1000}:${SDK_DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
      RUSTUP_AUTO_INSTALL: "0"

  sdk-python:
    build:
      context: .
      dockerfile: python/Dockerfile
      args:
        RUST_VERSION: ${RUST_VERSION:?set RUST_VERSION from rust-pin.env}
    volumes:
      - ../..:/workspace
      # uv's content-addressed cache; the environment itself is rebuilt each run.
      - openapp-sdk-uv-cache:/opt/uv-cache
      - openapp-sdk-cargo-registry:/usr/local/cargo/registry
      - openapp-sdk-cargo-git:/usr/local/cargo/git
      - openapp-sdk-rustup:/usr/local/rustup
    working_dir: /workspace
    user: "${SDK_DOCKER_UID:-1000}:${SDK_DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
      RUSTUP_AUTO_INSTALL: "0"
      UV_LINK_MODE: copy
      UV_CACHE_DIR: /opt/uv-cache
      # Per-run environment outside the bind mount; never touches the repo's .venv.
      UV_PROJECT_ENVIRONMENT: /tmp/sdk-python-venv

  sdk-go:
    build:
      context: ../..
      dockerfile: tests/docker/go/Dockerfile
      args:
        RUST_VERSION: ${RUST_VERSION:?set RUST_VERSION from rust-pin.env}
        RUST_DEBIAN: ${RUST_DEBIAN:?set RUST_DEBIAN from rust-pin.env}
    volumes:
      - ../..:/workspace
    working_dir: /workspace
    user: "${SDK_DOCKER_UID:-1000}:${SDK_DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
      # On the bind mount so caches survive `compose run --rm`. Host recipes mkdir
      # these paths as the invoking user first; creating them inside the container
      # as root leaves go/.gocache and go/.gomodcache undeletable.
      GOCACHE: /workspace/go/.gocache
      GOMODCACHE: /workspace/go/.gomodcache
      CGO_ENABLED: "1"
      LD_LIBRARY_PATH: "/workspace/rust/target/release/deps:/usr/local/lib"

volumes:
  openapp-sdk-cargo-registry:
  openapp-sdk-cargo-git:
  openapp-sdk-rustup:
  openapp-sdk-uv-cache:
